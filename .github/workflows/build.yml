name: Build launcher
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package
        shell: bash
        run: ./gradlew --no-daemon check standaloneJar installDist packageApp
      - name: Portable launcher
        uses: actions/upload-artifact@v4
        with:
          name: launcher-portable-${{ runner.os }}-${{ runner.arch }}
          path: build/standalone/blockbox-launcher.jar
      - name: Bundle application
        shell: bash
        run: tar -czf "blockbox-launcher-${{ runner.os }}-${{ runner.arch }}.tar.gz" -C build/native .
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-app-${{ runner.os }}-${{ runner.arch }}
          path: blockbox-launcher-*.tar.gz
